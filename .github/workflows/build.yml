      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Get SMAPI reference assemblies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p smapi refs
          url=$(gh api repos/Pathoschild/SMAPI/releases/latest --jq '.assets[] | select(.name | test("installer.*\\.zip$"; "i")) | .browser_download_url' | head -n1)
          echo "SMAPI installer: $url"
          curl -sSL "$url" -o smapi/installer.zip
          cd smapi
          unzip -q installer.zip -d l1
          # Newer SMAPI releases are double-zipped: unpack the inner zip if there is one.
          inner=$(find l1 -iname '*.zip' | head -n1)
          if [ -n "$inner" ]; then unzip -q "$inner" -d installer; else mv l1 installer; fi
          dat=$(find installer -path '*windows*' -name 'install.dat' | head -n1)
          [ -z "$dat" ] && dat=$(find installer -name 'install.dat' | head -n1)
          unzip -q "$dat" -d game
          cp "$(find game -name 'StardewModdingAPI.dll' | head -n1)" ../refs/
          cp "$(find game -name '0Harmony.dll' | head -n1)" ../refs/
          cp "$(find game -name 'SMAPI.Toolkit.CoreInterfaces.dll' | head -n1)" ../refs/
          ls -la ../refs

      - name: Build
        run: dotnet build HDSprites/HDSprites.csproj -c Release -p:SmapiRefDir="$GITHUB_WORKSPACE/refs"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out/HDSprites
          cp HDSprites/bin/Release/net6.0/HDSprites.dll out/HDSprites/
          cp HDSprites/manifest.json out/HDSprites/
          cd out && zip -qr ../HDSprites.zip HDSprites

      - uses: actions/upload-artifact@v4
        with:
          name: HDSprites
          path: out/

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest HDSprites.zip --title "HD Sprites (latest build)" --notes "Built from ${GITHUB_SHA::7}. Unzip into your Mods folder." --target "$GITHUB_SHA"
